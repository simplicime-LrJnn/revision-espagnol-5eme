<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugo-CM1 : Le Jeu de Conjugaison</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f3f4f6] selection:bg-indigo-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- STREAMING_CHUNK: Defining lessons data ---
        const lessonsData = [
          {
            title: "Le Présent de l'Indicatif",
            icon: "⏰",
            content: (
              <div className="space-y-3 text-sm md:text-base text-gray-700">
                <p>Le présent indique une action qui se passe <strong>en ce moment</strong>.</p>
                <div className="bg-blue-50 p-3 rounded-lg border border-blue-100">
                  <h4 className="font-bold text-blue-800 mb-1">Les terminaisons régulières :</h4>
                  <ul className="list-disc pl-5">
                    <li><strong>1er groupe (-ER)</strong> : -e, -es, -e, -ons, -ez, -ent <br/><span className="text-xs text-gray-500">(ex: chanter &rarr; je chant<span className="font-bold text-blue-600">e</span>)</span></li>
                    <li><strong>2ème groupe (-IR / -issons)</strong> : -is, -is, -it, -issons, -issez, -issent <br/><span className="text-xs text-gray-500">(ex: finir &rarr; tu fin<span className="font-bold text-blue-600">is</span>)</span></li>
                    <li><strong>3ème groupe</strong> : Souvent -s, -s, -t, -ons, -ez, -ent, mais attention aux <span className="text-red-500 font-bold">pièges</span> !</li>
                  </ul>
                </div>
              </div>
            )
          },
          {
            title: "Les Sujets (Qui fait l'action ?)",
            icon: "👤",
            content: (
              <div className="space-y-3 text-sm md:text-base text-gray-700">
                <p>Le verbe change selon <strong>qui</strong> fait l'action. C'est le sujet.</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                  <div className="bg-purple-50 p-2 rounded border border-purple-100">
                    <strong>Je, Tu, Il, Elle, On</strong> = Singulier (1 seule personne)
                  </div>
                  <div className="bg-green-50 p-2 rounded border border-green-100">
                    <strong>Nous, Vous, Ils, Elles</strong> = Pluriel (Plusieurs personnes)
                  </div>
                </div>
                <div className="bg-yellow-50 p-3 rounded-lg border border-yellow-200 mt-2">
                  <h4 className="font-bold text-yellow-800 mb-1">⚠️ Attention aux remplacements :</h4>
                  <ul className="list-disc pl-5">
                    <li>"Maman" = <strong>Elle</strong></li>
                    <li>"Maman et papa" = <strong>Ils</strong></li>
                    <li>"Toi et moi" = <strong>Nous</strong></li>
                    <li>"Claire et toi" = <strong>Vous</strong></li>
                  </ul>
                </div>
              </div>
            )
          }
        ];

        // --- STREAMING_CHUNK: Defining pools of subjects ---
        const subjectsPool = {
          je: ["Je", "Moi, je"],
          tu: ["Tu", "Toi, tu"],
          il: ["Il", "Elle", "On", "Claire", "Lucas", "Papa", "Maman", "Mon chien", "Le maître"],
          nous: ["Nous", "Toi et moi", "Papa et moi", "Mon frère et moi"],
          vous: ["Vous", "Claire et toi", "Les enfants et toi"],
          ils: ["Ils", "Elles", "Papa et maman", "Mes amis", "Les élèves", "Les enfants", "Claire et Léo"]
        };

        const complexSubjectsPool = {
          je: [
            "Moi qui arrive toujours en retard, je", 
            "Au milieu de la cour, moi, je",
            "Bien que fatigué, je"
          ], 
          tu: [
            "Toi qui sais tout mieux que tout le monde, tu", 
            "Malgré tes efforts, tu",
            "Dans ton grand manteau rouge, tu"
          ],
          il: [
            "Le gros chien noir du voisin qui aboie la nuit", 
            "La petite sœur de mon meilleur ami", 
            "Chacun des élèves de la classe",
            "L'équipe de football de l'école",
            "Le vieux livre poussiéreux de la bibliothèque",
            "Chacun de nous",
            "La majorité des enfants"
          ],
          nous: [
            "Ma famille entière et moi", 
            "Toute la classe de CM1 et moi", 
            "Ton frère, ma sœur et moi"
          ],
          vous: [
            "Tes nouveaux amis et toi", 
            "Toi et tes parents", 
            "Vous tous, assis au fond de la classe près de la fenêtre"
          ],
          ils: [
            "Les grands oiseaux migrateurs qui traversent le ciel", 
            "Les cahiers d'exercices bien rangés sur le bureau du fond", 
            "Le maître et la directrice de l'école", 
            "Mes parents, mes cousins et mes grands-parents", 
            "Les joueurs de l'équipe adverse"
          ]
        };

        // --- STREAMING_CHUNK: Defining verbs database ---
        const verbsData = [
          // 1er Groupe
          { infinitif: "aimer", groupe: 1, type: "régulier", je: "aime", tu: "aimes", il: "aime", nous: "aimons", vous: "aimez", ils: "aiment", piege: null },
          { infinitif: "parler", groupe: 1, type: "régulier", je: "parle", tu: "parles", il: "parle", nous: "parlons", vous: "parlez", ils: "parlent", piege: null },
          { infinitif: "jouer", groupe: 1, type: "régulier", je: "joue", tu: "joues", il: "joue", nous: "jouons", vous: "jouez", ils: "jouent", piege: null },
          { infinitif: "chanter", groupe: 1, type: "régulier", je: "chante", tu: "chantes", il: "chante", nous: "chantons", vous: "chantez", ils: "chantent", piege: null },
          { infinitif: "regarder", groupe: 1, type: "régulier", je: "regarde", tu: "regardes", il: "regarde", nous: "regardons", vous: "regardez", ils: "regardent", piege: null },
          { infinitif: "écouter", groupe: 1, type: "régulier", je: "écoute", tu: "écoutes", il: "écoute", nous: "écoutons", vous: "écoutez", ils: "écoutent", piege: null },
          { infinitif: "travailler", groupe: 1, type: "régulier", je: "travaille", tu: "travailles", il: "travaille", nous: "travaillons", vous: "travaillez", ils: "travaillent", piege: null },
          { infinitif: "marcher", groupe: 1, type: "régulier", je: "marche", tu: "marches", il: "marche", nous: "marchons", vous: "marchez", ils: "marchent", piege: null },
          { infinitif: "danser", groupe: 1, type: "régulier", je: "danse", tu: "danses", il: "danse", nous: "dansons", vous: "dansez", ils: "dansent", piege: null },
          { infinitif: "appeler", groupe: 1, type: "piège", je: "appelle", tu: "appelles", il: "appelle", nous: "appelons", vous: "appelez", ils: "appellent", piege: "On double le 'L' (ll) sauf avec Nous et Vous !" },
          { infinitif: "jeter", groupe: 1, type: "piège", je: "jette", tu: "jettes", il: "jette", nous: "jetons", vous: "jetez", ils: "jettent", piege: "On double le 'T' (tt) sauf avec Nous et Vous !" },
          { infinitif: "lancer", groupe: 1, type: "piège", je: "lance", tu: "lances", il: "lance", nous: "lançons", vous: "lancez", ils: "lancent", piege: "Attention à la cédille (ç) avec 'Nous' : nous lançons." },
          { infinitif: "commencer", groupe: 1, type: "piège", je: "commence", tu: "commences", il: "commence", nous: "commençons", vous: "commencez", ils: "commencent", piege: "Attention à la cédille (ç) avec 'Nous' : nous commençons." },
          { infinitif: "manger", groupe: 1, type: "piège", je: "mange", tu: "manges", il: "mange", nous: "mangeons", vous: "mangez", ils: "mangent", piege: "On garde le 'e' avec 'Nous' : nous mangeons." },
          { infinitif: "payer", groupe: 1, type: "piège", je: "paie", tu: "paies", il: "paie", nous: "payons", vous: "payez", ils: "paient", piege: "Le 'y' devient 'i' avec je, tu, il, ils." },

          // 2ème Groupe
          { infinitif: "finir", groupe: 2, type: "régulier", je: "finis", tu: "finis", il: "finit", nous: "finissons", vous: "finissez", ils: "finissent", piege: "Prend -issons avec nous." },
          { infinitif: "choisir", groupe: 2, type: "régulier", je: "choisis", tu: "choisis", il: "choisit", nous: "choisissons", vous: "choisissez", ils: "choisissent", piege: "Prend -issons avec nous." },
          { infinitif: "grandir", groupe: 2, type: "régulier", je: "grandis", tu: "grandis", il: "grandit", nous: "grandissons", vous: "grandissez", ils: "grandissent", piege: "Prend -issons avec nous." },
          { infinitif: "réussir", groupe: 2, type: "régulier", je: "réussis", tu: "réussis", il: "réussit", nous: "réussissons", vous: "réussissez", ils: "réussissent", piege: "Prend -issons avec nous." },
          { infinitif: "réfléchir", groupe: 2, type: "régulier", je: "réfléchis", tu: "réfléchis", il: "réfléchit", nous: "réfléchissons", vous: "réfléchissez", ils: "réfléchissent", piege: "Prend -issons avec nous." },
          { infinitif: "rougir", groupe: 2, type: "régulier", je: "rougis", tu: "rougis", il: "rougit", nous: "rougissons", vous: "rougissez", ils: "rougissent", piege: "Prend -issons avec nous." },

          // 3ème Groupe
          { infinitif: "être", groupe: 3, type: "irrégulier", je: "suis", tu: "es", il: "est", nous: "sommes", vous: "êtes", ils: "sont", piege: "Très irrégulier ! À apprendre par cœur." },
          { infinitif: "avoir", groupe: 3, type: "irrégulier", je: "ai", tu: "as", il: "a", nous: "avons", vous: "avez", ils: "ont", piege: "Très irrégulier ! À apprendre par cœur." },
          { infinitif: "aller", groupe: 3, type: "irrégulier", je: "vais", tu: "vas", il: "va", nous: "allons", vous: "allez", ils: "vont", piege: "Change complètement de radical !" },
          { infinitif: "faire", groupe: 3, type: "irrégulier", je: "fais", tu: "fais", il: "fait", nous: "faisons", vous: "faites", ils: "font", piege: "Attention à 'Vous FAITES' !" },
          { infinitif: "dire", groupe: 3, type: "irrégulier", je: "dis", tu: "dis", il: "dit", nous: "disons", vous: "dites", ils: "disent", piege: "Attention à 'Vous DITES' !" },
          { infinitif: "lire", groupe: 3, type: "irrégulier", je: "lis", tu: "lis", il: "lit", nous: "lisons", vous: "lisez", ils: "lisent", piege: "Prend un 't' à la 3e personne du singulier." },
          { infinitif: "écrire", groupe: 3, type: "irrégulier", je: "écris", tu: "écris", il: "écrit", nous: "écrivons", vous: "écrivez", ils: "écrivent", piege: "Attention au 'v' qui apparaît au pluriel." },
          { infinitif: "voir", groupe: 3, type: "irrégulier", je: "vois", tu: "vois", il: "voit", nous: "voyons", vous: "voyez", ils: "voient", piege: "Attention au double 'i' avec ils (voient)." },
          { infinitif: "venir", groupe: 3, type: "irrégulier", je: "viens", tu: "viens", il: "vient", nous: "venons", vous: "venez", ils: "viennent", piege: "Prend deux 'n' avec Ils/Elles." },
          { infinitif: "vouloir", groupe: 3, type: "irrégulier", je: "veux", tu: "veux", il: "veut", nous: "voulons", vous: "voulez", ils: "veulent", piege: "Se termine par un 'x' au singulier." },
          { infinitif: "pouvoir", groupe: 3, type: "irrégulier", je: "peux", tu: "peux", il: "peut", nous: "pouvons", vous: "pouvez", ils: "peuvent", piege: "Se termine par un 'x' au singulier." },
          { infinitif: "prendre", groupe: 3, type: "irrégulier", je: "prends", tu: "prends", il: "prend", nous: "prenons", vous: "prenez", ils: "prennent", piege: "Perd son 'd' au pluriel, double 'n' à ils." },
          { infinitif: "apprendre", groupe: 3, type: "irrégulier", je: "apprends", tu: "apprends", il: "apprend", nous: "apprenons", vous: "apprenez", ils: "apprennent", piege: "Se conjugue comme prendre." },
          { infinitif: "comprendre", groupe: 3, type: "irrégulier", je: "comprends", tu: "comprends", il: "comprend", nous: "comprenons", vous: "comprenez", ils: "comprennent", piege: "Se conjugue comme prendre." },
          { infinitif: "mettre", groupe: 3, type: "irrégulier", je: "mets", tu: "mets", il: "met", nous: "mettons", vous: "mettez", ils: "mettent", piege: "Perd un 't' au singulier." },
          { infinitif: "partir", groupe: 3, type: "irrégulier", je: "pars", tu: "pars", il: "part", nous: "partons", vous: "partez", ils: "partent", piege: "3e groupe malgré la fin en -ir." },
          { infinitif: "sortir", groupe: 3, type: "irrégulier", je: "sors", tu: "sors", il: "sort", nous: "sortons", vous: "sortez", ils: "sortent", piege: "3e groupe malgré la fin en -ir." },
          { infinitif: "devoir", groupe: 3, type: "irrégulier", je: "dois", tu: "dois", il: "doit", nous: "devons", vous: "devez", ils: "doivent", piege: "Radical change au pluriel." },
          { infinitif: "recevoir", groupe: 3, type: "irrégulier", je: "reçois", tu: "reçois", il: "reçoit", nous: "recevons", vous: "recevez", ils: "reçoivent", piege: "Cédille (ç) avant o et u." },
          { infinitif: "pleuvoir", groupe: 3, type: "irrégulier", je: null, tu: null, il: "pleut", nous: null, vous: null, ils: null, piege: "Verbe impersonnel (existe seulement à 'il')." }
        ];

        // --- STREAMING_CHUNK: Quiz generator function ---
        const generateQuizSet = (count, difficulty = 'moyen') => {
          const questions = [];
          const usedCombos = new Set();

          let verbsPool = verbsData;
          if (difficulty === 'facile') {
            verbsPool = verbsData.filter(v => v.groupe === 1 && v.type === 'régulier');
          } else if (difficulty === 'difficile') {
            verbsPool = verbsData.filter(v => v.type === 'piège' || v.groupe === 3);
            if (verbsPool.length < 5) verbsPool = verbsData;
          }

          const currentSubjectsPool = difficulty === 'difficile' ? complexSubjectsPool : subjectsPool;

          while (questions.length < count) {
            const verb = verbsPool[Math.floor(Math.random() * verbsPool.length)];
            let persons = ['je', 'tu', 'il', 'nous', 'vous', 'ils'];
            if (verb.infinitif === 'pleuvoir') persons = ['il'];

            const person = persons[Math.floor(Math.random() * persons.length)];
            const subjects = currentSubjectsPool[person] || subjectsPool[person];
            const subject = subjects[Math.floor(Math.random() * subjects.length)];

            const comboKey = `${verb.infinitif}-${subject}`;
            if (usedCombos.has(comboKey)) continue;
            usedCombos.add(comboKey);

            const correctAnswer = verb[person];
            if (!correctAnswer) continue;

            let options = [correctAnswer];
            let distractors = [];

            if (verb.infinitif === 'aller' && person === 'ils') distractors.push('allent');
            if (verb.infinitif === 'faire' && person === 'vous') distractors.push('faisez');
            if (verb.infinitif === 'dire' && person === 'vous') distractors.push('disez');
            if (verb.infinitif === 'appeler' && person === 'il') distractors.push('appele', 'apelle');
            if (verb.infinitif === 'manger' && person === 'nous') distractors.push('mangons');
            if (verb.infinitif === 'lancer' && person === 'nous') distractors.push('lancons');
            if (verb.infinitif === 'prendre' && person === 'ils') distractors.push('prendent');
            if (verb.infinitif === 'venir' && person === 'ils') distractors.push('venent');

            if (person === 'tu' && !correctAnswer.endsWith('x')) distractors.push(correctAnswer.slice(0, -1));
            if (person === 'je' && verb.groupe === 1) distractors.push(correctAnswer + 's');

            const otherPersons = persons.filter(p => p !== person && verb[p]);
            distractors.push(...otherPersons.map(p => verb[p]));

            distractors = [...new Set(distractors)].filter(d => d !== correctAnswer).sort(() => 0.5 - Math.random());
            options.push(...distractors.slice(0, 3));

            while (options.length < 4) {
              const randomVerb = verbsData[Math.floor(Math.random() * verbsData.length)];
              const randomForm = randomVerb['il'];
              if (!options.includes(randomForm) && randomForm) options.push(randomForm);
            }

            options = options.sort(() => 0.5 - Math.random());

            questions.push({
              verb: verb.infinitif,
              subject: subject,
              correctAnswer: correctAnswer,
              options: options,
              hint: `Indice : Verbe "${verb.infinitif}" (${verb.groupe}${verb.groupe === 1 ? 'er' : 'ème'} groupe).`,
              piege: verb.piege
            });
          }
          return questions;
        };

        // --- STREAMING_CHUNK: UI Components ---
        const TabButton = ({ active, onClick, icon, label, colorClass }) => (
          <button
            onClick={onClick}
            className={`flex items-center gap-2 px-4 py-3 rounded-t-xl transition-all font-bold text-sm md:text-base border-b-4 
              ${active ? `${colorClass} border-opacity-100 bg-white shadow-sm -mb-1 z-10` : 'bg-white/50 text-gray-500 border-transparent hover:bg-white/80'}`}
          >
            {icon}
            <span>{label}</span>
          </button>
        );

        const LessonCard = ({ title, icon, content }) => (
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
            <h3 className="flex items-center gap-3 text-xl font-bold text-indigo-900 mb-4">
              <span className="text-2xl">{icon}</span> {title}
            </h3>
            {content}
          </div>
        );

        const VerbCard = ({ verb }) => {
          const isPiege = verb.type === 'piège' || verb.type === 'irrégulier';
          return (
            <div className={`rounded-xl p-4 border-2 transition-transform hover:scale-[1.02] ${isPiege ? 'bg-orange-50 border-orange-200' : 'bg-white border-blue-100'}`}>
              <div className="flex justify-between items-start mb-3">
                <h3 className="text-xl font-black text-gray-800 capitalize">{verb.infinitif}</h3>
                <span className={`text-xs font-bold px-2 py-1 rounded-full ${verb.groupe === 1 ? 'bg-green-100 text-green-700' : verb.groupe === 2 ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>
                  {verb.groupe}{verb.groupe === 1 ? 'er' : 'ème'} Gr.
                </span>
              </div>
              
              {verb.piege && (
                <div className="flex items-start gap-2 bg-red-100/60 text-red-800 p-2 rounded-lg text-sm mb-3 font-medium">
                  <span className="text-lg">💡</span>
                  <p>{verb.piege}</p>
                </div>
              )}

              <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-sm text-gray-700 font-medium">
                {verb.infinitif !== 'pleuvoir' ? (
                   <>
                    <div><span className="text-gray-400 w-10 inline-block">Je</span> {verb.je}</div>
                    <div><span className="text-gray-400 w-12 inline-block">Nous</span> {verb.nous}</div>
                    <div><span className="text-gray-400 w-10 inline-block">Tu</span> {verb.tu}</div>
                    <div><span className="text-gray-400 w-12 inline-block">Vous</span> {verb.vous}</div>
                    <div><span className="text-gray-400 w-10 inline-block">Il/Elle</span> {verb.il}</div>
                    <div><span className="text-gray-400 w-12 inline-block">Ils/Elles</span> {verb.ils}</div>
                   </>
                ) : (
                    <div className="col-span-2 text-center text-lg mt-2">Il <span className="font-bold text-blue-600">{verb.il}</span></div>
                )}
              </div>
            </div>
          );
        };

        // --- STREAMING_CHUNK: Quiz Section ---
        const QuizSection = () => {
          const [questions, setQuestions] = useState([]);
          const [currentIdx, setCurrentIdx] = useState(0);
          const [score, setScore] = useState(0);
          const [gameState, setGameState] = useState('menu');
          const [selectedAnswer, setSelectedAnswer] = useState(null);
          const [showFeedback, setShowFeedback] = useState(false);
          const [difficultyLevel, setDifficultyLevel] = useState('moyen');

          const startQuiz = (count) => {
            setQuestions(generateQuizSet(count, difficultyLevel));
            setCurrentIdx(0);
            setScore(0);
            setGameState('playing');
            setShowFeedback(false);
            setSelectedAnswer(null);
          };

          const handleAnswer = (answer) => {
            if (showFeedback) return;
            setSelectedAnswer(answer);
            const currentQ = questions[currentIdx];
            if (answer === currentQ.correctAnswer) setScore(score + 1);
            setShowFeedback(true);
          };

          const nextQuestion = () => {
            if (currentIdx + 1 < questions.length) {
              setCurrentIdx(currentIdx + 1);
              setShowFeedback(false);
              setSelectedAnswer(null);
            } else {
              setGameState('result');
            }
          };

          if (gameState === 'menu') {
            return (
              <div className="text-center space-y-6 py-4">
                <h2 className="text-3xl font-black text-indigo-900 mb-2">Quiz d'Entraînement 100% QCM</h2>
                <p className="text-gray-600 mb-6 max-w-md mx-auto">Choisis ton niveau de difficulté puis lance ton test !</p>
                
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-2xl mx-auto mb-8">
                  <button onClick={() => setDifficultyLevel('facile')} className={`p-4 rounded-2xl border-2 transition-all flex flex-col items-center justify-center ${difficultyLevel === 'facile' ? 'border-green-500 bg-green-50 shadow-md ring-2 ring-green-200' : 'border-gray-200 hover:border-green-300 bg-white'}`}>
                    <span className="text-lg font-black text-green-600 mb-1">⭐ Facile</span>
                    <span className="text-xs text-gray-500">1er groupe régulier</span>
                  </button>

                  <button onClick={() => setDifficultyLevel('moyen')} className={`p-4 rounded-2xl border-2 transition-all flex flex-col items-center justify-center ${difficultyLevel === 'moyen' ? 'border-yellow-500 bg-yellow-50 shadow-md ring-2 ring-yellow-200' : 'border-gray-200 hover:border-yellow-300 bg-white'}`}>
                    <span className="text-lg font-black text-yellow-600 mb-1">⭐⭐ Moyen</span>
                    <span className="text-xs text-gray-500">Tous les groupes</span>
                  </button>

                  <button onClick={() => setDifficultyLevel('difficile')} className={`p-4 rounded-2xl border-2 transition-all flex flex-col items-center justify-center ${difficultyLevel === 'difficile' ? 'border-red-500 bg-red-50 shadow-md ring-2 ring-red-200' : 'border-gray-200 hover:border-red-300 bg-white'}`}>
                    <span className="text-lg font-black text-red-600 mb-1">⭐⭐⭐ Difficile</span>
                    <span className="text-xs text-gray-500">Pièges complexes & verbes piégeux</span>
                  </button>
                </div>

                <div className="flex flex-col sm:flex-row justify-center gap-4">
                  <button onClick={() => startQuiz(10)} className="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-4 rounded-2xl shadow-lg font-bold text-lg transition-transform hover:scale-105">
                    🎯 10 Questions
                  </button>
                  <button onClick={() => startQuiz(20)} className="bg-purple-500 hover:bg-purple-600 text-white px-6 py-4 rounded-2xl shadow-lg font-bold text-lg transition-transform hover:scale-105">
                    🎯 20 Questions
                  </button>
                </div>
              </div>
            );
          }

          if (gameState === 'result') {
            const percentage = (score / questions.length) * 100;
            let message = percentage === 100 ? "Parfait ! Un vrai champion ! 🏆" : percentage >= 80 ? "Super travail ! 🌟" : "Bien ! Continue à t'entraîner. 💪";
            return (
              <div className="text-center bg-white p-8 rounded-3xl shadow-sm border border-gray-100 py-12">
                <h2 className="text-3xl font-black text-gray-800 mb-4">Résultat du Quiz</h2>
                <div className="text-6xl font-black text-indigo-600 mb-4">{score} / {questions.length}</div>
                <p className="text-xl font-medium text-gray-700 mb-8">{message}</p>
                <button onClick={() => setGameState('menu')} className="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-6 py-3 rounded-xl font-bold transition-colors mx-auto">
                  🔄 Recommencer
                </button>
              </div>
            );
          }

          const currentQ = questions[currentIdx];
          const progress = (currentIdx / questions.length) * 100;

          return (
            <div className="max-w-2xl mx-auto">
              <div className="w-full bg-gray-200 rounded-full h-3 mb-6 overflow-hidden">
                <div className="bg-indigo-500 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
              </div>

              <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100">
                <div className="flex justify-between items-center mb-6">
                  <span className="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full font-bold text-sm">Question {currentIdx + 1}/{questions.length}</span>
                  <span className="text-gray-500 font-medium">Verbe : <span className="text-gray-800 uppercase font-bold">{currentQ.verb}</span></span>
                </div>

                <div className="text-xl md:text-2xl font-medium text-center mb-8 flex items-baseline justify-center flex-wrap gap-x-2">
                  <span className="font-bold text-indigo-900">{currentQ.subject}</span>
                  <span className="inline-block border-b-4 border-dotted border-gray-300 w-32 pb-1 text-center text-gray-400">
                    {showFeedback ? <span className={`font-bold ${selectedAnswer === currentQ.correctAnswer ? 'text-green-600' : 'text-red-600'}`}>{selectedAnswer}</span> : "..."}
                  </span>
                  <span className="text-gray-700">.</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {currentQ.options.map((opt, i) => {
                    let btnStyle = "border-indigo-100 hover:border-indigo-500 hover:bg-indigo-50 text-gray-700";
                    if (showFeedback) {
                      if (opt === currentQ.correctAnswer) btnStyle = "bg-green-100 border-green-500 text-green-800";
                      else if (opt === selectedAnswer) btnStyle = "bg-red-100 border-red-500 text-red-800";
                    }
                    return (
                      <button key={i} onClick={() => handleAnswer(opt)} className={`p-4 rounded-xl border-2 font-bold text-lg transition-all text-center ${btnStyle}`}>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {showFeedback && (
                  <div className="mt-8">
                    <div className={`p-4 rounded-xl mb-4 ${selectedAnswer === currentQ.correctAnswer ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                      <p className="font-bold text-lg mb-1">{selectedAnswer === currentQ.correctAnswer ? 'Bonne réponse !' : `Faux ! La bonne réponse était : ${currentQ.correctAnswer}`}</p>
                      <p className="text-sm opacity-90">{currentQ.hint}</p>
                      {currentQ.piege && <p className="text-sm font-medium mt-2 bg-white/50 p-2 rounded">💡 {currentQ.piege}</p>}
                    </div>
                    <button onClick={nextQuestion} className="w-full bg-gray-800 hover:bg-gray-900 text-white p-4 rounded-xl font-bold text-lg transition-colors">
                      Continuer ➡️
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // --- STREAMING_CHUNK: Duel 1v1 Mode with 3 Difficulties ---
        const DuelGame = () => {
          const [gameState, setGameState] = useState('menu');
          const [difficultyLevel, setDifficultyLevel] = useState('moyen');
          const [questions, setQuestions] = useState([]);
          const [currentIdx, setCurrentIdx] = useState(0);
          const [scores, setScores] = useState({ p1: 0, p2: 0 });
          const currentQRef = useRef(null);

          const startDuel = () => {
            const newQuestions = generateQuizSet(15, difficultyLevel).map(q => ({
              ...q,
              optionsP1: q.options.map((o, idx) => ({ text: o, key: ['A', 'Z', 'E', 'R'][idx] })),
              optionsP2: q.options.map((o, idx) => ({ text: o, key: ['U', 'I', 'O', 'P'][idx] }))
            }));
            setQuestions(newQuestions);
            currentQRef.current = newQuestions[0];
            setCurrentIdx(0);
            setScores({ p1: 0, p2: 0 });
            setGameState('playing');
          };

          useEffect(() => {
            if (gameState === 'playing') {
              currentQRef.current = questions[currentIdx];
              const handleKeyDown = (e) => {
                const key = e.key.toUpperCase();
                const currentQ = currentQRef.current;
                if (!currentQ) return;

                const p1Keys = ['A', 'Z', 'E', 'R'];
                if (p1Keys.includes(key)) {
                  const idx = p1Keys.indexOf(key);
                  if (idx < currentQ.options.length) handleDuelAnswer('p1', currentQ.options[idx]);
                }

                const p2Keys = ['U', 'I', 'O', 'P'];
                if (p2Keys.includes(key)) {
                  const idx = p2Keys.indexOf(key);
                  if (idx < currentQ.options.length) handleDuelAnswer('p2', currentQ.options[idx]);
                }
              };
              window.addEventListener('keydown', handleKeyDown);
              return () => window.removeEventListener('keydown', handleKeyDown);
            }
          }, [gameState, currentIdx, questions]);

          const handleDuelAnswer = (player, answer) => {
            const currentQ = currentQRef.current;
            if (!currentQ) return;
            const isCorrect = (answer === currentQ.correctAnswer);
            setScores(prev => ({ ...prev, [player]: prev[player] + (isCorrect ? 1 : -1) }));
            if (currentIdx + 1 < questions.length) {
              setCurrentIdx(prev => prev + 1);
            } else {
              setGameState('end');
            }
          };

          if (gameState === 'menu') {
            return (
              <div className="text-center space-y-6 py-4">
                <div className="inline-flex items-center justify-center p-4 bg-orange-100 rounded-full mb-1">⚔️</div>
                <h2 className="text-3xl font-black text-orange-600 mb-2">Défi Conjugaison (1v1)</h2>
                <p className="text-gray-600 mb-4 max-w-md mx-auto">Jouez à 2 sur le même clavier ! Le plus rapide gagne des points (attention, une erreur enlève 1 point).</p>
                
                {/* Sélecteur de difficulté Duel */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-2xl mx-auto mb-6">
                  <button onClick={() => setDifficultyLevel('facile')} className={`p-3 rounded-2xl border-2 transition-all flex flex-col items-center justify-center ${difficultyLevel === 'facile' ? 'border-green-500 bg-green-50 shadow-md ring-2 ring-green-200' : 'border-gray-200 hover:border-green-300 bg-white'}`}>
                    <span className="text-base font-black text-green-600 mb-1">⭐ Facile</span>
                    <span className="text-xs text-gray-500">1er groupe régulier</span>
                  </button>

                  <button onClick={() => setDifficultyLevel('moyen')} className={`p-3 rounded-2xl border-2 transition-all flex flex-col items-center justify-center ${difficultyLevel === 'moyen' ? 'border-yellow-500 bg-yellow-50 shadow-md ring-2 ring-yellow-200' : 'border-gray-200 hover:border-yellow-300 bg-white'}`}>
                    <span className="text-base font-black text-yellow-600 mb-1">⭐⭐ Moyen</span>
                    <span className="text-xs text-gray-500">Tous les groupes</span>
                  </button>

                  <button onClick={() => setDifficultyLevel('difficile')} className={`p-3 rounded-2xl border-2 transition-all flex flex-col items-center justify-center ${difficultyLevel === 'difficile' ? 'border-red-500 bg-red-50 shadow-md ring-2 ring-red-200' : 'border-gray-200 hover:border-red-300 bg-white'}`}>
                    <span className="text-base font-black text-red-600 mb-1">⭐⭐⭐ Difficile</span>
                    <span className="text-xs text-gray-500">Pièges & phrases complexes</span>
                  </button>
                </div>

                <div className="flex justify-center gap-6 mb-6 text-left">
                  <div className="bg-blue-50 p-3 rounded-xl border border-blue-200">
                    <h4 className="font-bold text-blue-800 mb-1 text-sm">Joueur 1</h4>
                    <p className="text-xs text-gray-600 mb-1">Touches :</p>
                    <div className="flex gap-1">
                      {['A', 'Z', 'E', 'R'].map(k => <kbd key={k} className="bg-white border shadow-sm px-2 py-0.5 rounded font-mono font-bold text-xs">{k}</kbd>)}
                    </div>
                  </div>
                  <div className="bg-red-50 p-3 rounded-xl border border-red-200">
                    <h4 className="font-bold text-red-800 mb-1 text-sm">Joueur 2</h4>
                    <p className="text-xs text-gray-600 mb-1">Touches :</p>
                    <div className="flex gap-1">
                      {['U', 'I', 'O', 'P'].map(k => <kbd key={k} className="bg-white border shadow-sm px-2 py-0.5 rounded font-mono font-bold text-xs">{k}</kbd>)}
                    </div>
                  </div>
                </div>

                <button onClick={startDuel} className="bg-orange-500 hover:bg-orange-600 text-white px-8 py-4 rounded-2xl shadow-lg font-black text-xl transition-transform hover:scale-105">
                  C'EST PARTI ! 🚀
                </button>
              </div>
            );
          }

          if (gameState === 'end') {
            const winner = scores.p1 > scores.p2 ? 'Joueur 1' : (scores.p2 > scores.p1 ? 'Joueur 2' : 'Égalité');
            return (
              <div className="text-center py-12">
                <h2 className="text-4xl font-black mb-8 text-gray-800">Fin du match !</h2>
                <div className="flex justify-center items-end gap-8 mb-8">
                  <div className="text-center"><div className="text-5xl font-black text-blue-600 mb-2">{scores.p1}</div><div className="font-bold text-gray-500">Joueur 1</div></div>
                  <div className="text-2xl font-black text-gray-400 mb-6">VS</div>
                  <div className="text-center"><div className="text-5xl font-black text-red-600 mb-2">{scores.p2}</div><div className="font-bold text-gray-500">Joueur 2</div></div>
                </div>
                <div className="text-3xl font-black text-orange-500 mb-8">{winner === 'Égalité' ? "Match Nul !" : `🏆 Victoire : ${winner} !`}</div>
                <button onClick={() => setGameState('menu')} className="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-3 rounded-xl font-bold">Rejouer</button>
              </div>
            );
          }

          const currentQ = questions[currentIdx];

          return (
            <div className="bg-slate-900 rounded-3xl p-6 shadow-2xl border-4 border-slate-800 text-white max-w-4xl mx-auto">
              <div className="flex justify-between items-center mb-6">
                <div className="text-3xl font-black text-blue-400 bg-blue-950 px-4 py-2 rounded-xl">{scores.p1} pts</div>
                <div className="text-slate-400 font-bold">Question {currentIdx + 1}/{questions.length}</div>
                <div className="text-3xl font-black text-red-400 bg-red-950 px-4 py-2 rounded-xl">{scores.p2} pts</div>
              </div>

              <div className="text-center mb-8">
                <div className="text-slate-400 text-xs uppercase tracking-widest mb-1">Verbe : {currentQ.verb}</div>
                <div className="text-3xl md:text-4xl font-black text-white flex items-center justify-center gap-2 flex-wrap">
                  <span className="text-yellow-300">{currentQ.subject}</span>
                  <span className="w-24 border-b-4 border-slate-600 pb-1"></span>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-2 bg-blue-950/40 p-4 rounded-2xl border border-blue-500/20">
                  <div className="text-xs font-bold text-blue-300 uppercase mb-2">Joueur 1 (A-Z-E-R)</div>
                  {currentQ.optionsP1.map((opt, i) => (
                    <div key={i} className="w-full bg-blue-900/60 p-3 rounded-xl flex justify-between items-center text-blue-100 font-bold border border-blue-700/30">
                      <kbd className="bg-blue-950 px-2 py-1 rounded text-xs font-mono">{opt.key}</kbd>
                      <span>{opt.text}</span>
                    </div>
                  ))}
                </div>

                <div className="space-y-2 bg-red-950/40 p-4 rounded-2xl border border-red-500/20">
                  <div className="text-xs font-bold text-red-300 uppercase mb-2">Joueur 2 (U-I-O-P)</div>
                  {currentQ.optionsP2.map((opt, i) => (
                    <div key={i} className="w-full bg-red-900/60 p-3 rounded-xl flex justify-between items-center text-red-100 font-bold border border-red-700/30 flex-row-reverse">
                      <kbd className="bg-red-950 px-2 py-1 rounded text-xs font-mono">{opt.key}</kbd>
                      <span>{opt.text}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        // --- STREAMING_CHUNK: Main Application Layout ---
        const App = () => {
          const [activeTab, setActiveTab] = useState('lecons');

          return (
            <div className="min-h-screen bg-[#f3f4f6] font-sans">
              <header className="bg-indigo-600 text-white p-6 shadow-md">
                <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                     <div className="bg-white p-2 rounded-xl text-indigo-600 font-black text-2xl shadow-inner">📚</div>
                     <div>
                       <h1 className="text-2xl md:text-3xl font-black tracking-tight">Conjugo<span className="text-yellow-300">CM1</span></h1>
                       <p className="text-indigo-200 text-sm font-medium">Maîtrise les verbes et déjoue les pièges !</p>
                     </div>
                  </div>
                  <div className="bg-indigo-800/50 px-4 py-2 rounded-full text-sm font-medium border border-indigo-500/30">Niveau : CM1</div>
                </div>
              </header>

              <main className="max-w-5xl mx-auto p-4 md:p-6 mt-4">
                <div className="flex flex-wrap gap-2 border-b-4 border-indigo-100 px-4 pt-2 bg-indigo-50/50 rounded-t-2xl">
                  <TabButton active={activeTab === 'lecons'} onClick={() => setActiveTab('lecons')} icon="📖" label="Leçons & Règles" colorClass="text-indigo-700 border-indigo-500" />
                  <TabButton active={activeTab === 'verbes'} onClick={() => setActiveTab('verbes')} icon="📝" label="Liste des Verbes" colorClass="text-blue-700 border-blue-500" />
                  <TabButton active={activeTab === 'quiz'} onClick={() => setActiveTab('quiz')} icon="🎯" label="Entraînement" colorClass="text-purple-700 border-purple-500" />
                  <TabButton active={activeTab === 'duel'} onClick={() => setActiveTab('duel')} icon="⚔️" label="Duel 1v1" colorClass="text-orange-700 border-orange-500" />
                </div>

                <div className="bg-white/40 p-1 rounded-b-2xl shadow-sm mb-12">
                  <div className="bg-[#f8f9fa] rounded-xl p-4 md:p-8 min-h-[60vh] border border-white/50">
                    {activeTab === 'lecons' && (
                      <div>
                        <div className="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 mb-8 shadow-sm">
                          <h2 className="text-2xl font-black text-indigo-900 mb-2">💡 Avant de commencer...</h2>
                          <p className="text-indigo-800">La conjugaison, c'est comme un jeu de construction. Tu prends un <strong>sujet</strong> (le chef) et tu choisis la bonne terminaison du verbe !</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {lessonsData.map((lesson, idx) => <LessonCard key={idx} {...lesson} />)}
                        </div>
                      </div>
                    )}

                    {activeTab === 'verbes' && (
                      <div>
                        <h2 className="text-2xl font-black text-gray-800 mb-6">Les Verbes à Connaître</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {verbsData.map((verb, idx) => <VerbCard key={idx} verb={verb} />)}
                        </div>
                      </div>
                    )}

                    {activeTab === 'quiz' && <QuizSection />}
                    {activeTab === 'duel' && <DuelGame />}
                  </div>
                </div>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
